name: RevVault Multi-Platform Packaging & Release Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release with assets (True/False)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Linux Packaging Job (Tarball & AppImage)
  # ----------------------------------------------------------------------------
  build-linux:
    name: Build Linux Packages (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building RevVault Linux release version: ${VERSION}"

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file wget

      - name: Set up AppImageTool (FUSE-independent extraction)
        run: |
          sudo mkdir -p /opt/appimagetool
          cd /opt/appimagetool
          sudo wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          sudo chmod +x appimagetool.AppImage
          sudo ./appimagetool.AppImage --appimage-extract
          sudo ln -sf /opt/appimagetool/squashfs-root/AppRun /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Python backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile and package RevVault Linux release
        run: |
          python scripts/build_release.py --linux --version "${{ env.RELEASE_VERSION }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revvault-linux-x64
          path: |
            dist/revvault-linux-x64-v*.tar.gz
            dist/RevVault-v*-x86_64.AppImage
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # 2. Windows Packaging Job (Portable Zip & Inno Setup Installer)
  # ----------------------------------------------------------------------------
  build-windows:
    name: Build Windows Packages (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $VERSION = "1.0.0"
          }
          "RELEASE_VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building RevVault Windows release version: $VERSION"

      - name: Install Inno Setup compiler
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Python backend requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile and package RevVault Windows release
        shell: pwsh
        run: |
          python scripts/build_release.py --windows --version "${{ env.RELEASE_VERSION }}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revvault-windows-x64
          path: |
            dist/revvault-windows-x64-v*.zip
            dist/RevVault-Setup-v*.exe
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # 3. Android Packaging Job (Release APK)
  # ----------------------------------------------------------------------------
  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building RevVault Android release version: ${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compile RevVault Android Release APK
        run: |
          python3 scripts/build_release.py --apk --version "${{ env.RELEASE_VERSION }}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revvault-android-apk
          path: |
            dist/revvault.apk
            dist/RevVault-v*.apk
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # 4. Automated GitHub Release Publication Job
  # ----------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [ build-linux, build-windows, build-android ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Inspect and list compiled distribution assets
        run: |
          echo "=== RevVault Multi-Platform Artifact Matrix ==="
          ls -lh release_assets/

      - name: Determine tag name for release
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Designated Tag: ${TAG_NAME}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "RevVault Release ${{ steps.release_meta.outputs.tag_name }}"
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
